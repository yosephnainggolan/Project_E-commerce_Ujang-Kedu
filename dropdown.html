<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dropdown Menu Profile – MICROTECH</title>

  <!-- Hanya Bootstrap 5.3 + Bootstrap Icons. Tidak ada tag style atau CSS buatan sendiri:
       semua tampilan diatur lewat class Bootstrap pada tiap elemen. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="overflow-x-hidden">
<!-- ============ NAVBAR (grid 3 : 6 : 3 agar menu tepat di tengah) ============ -->
<nav class="navbar navbar-expand-lg bg-white border-bottom border-dark sticky-top py-2" style="font-family: 'Orbitron', sans-serif;">
  <div class="container-fluid px-3 px-lg-4">
    <div class="row w-100 g-0 align-items-center">

      <!-- Kiri: logo -->
      <div class="col-6 col-lg-3">
        <a class="navbar-brand m-0" href="dropdown.html">
          <img src="asset.img/header-logoBrand.jpg" alt="Microtech" class="img-fluid" width="150">
        </a>
      </div>

      <!-- Kanan: Dropdown Menu Profile + tombol hamburger (di HP) -->
      <div class="col-6 col-lg-3 order-lg-3 d-flex justify-content-end align-items-center gap-2">
        <div class="dropdown">
          <a class="d-inline-flex align-items-center gap-2 text-dark text-decoration-none font-monospace fw-bold small text-nowrap"
             href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="true">
            <span class="position-relative d-inline-flex rounded-circle bg-danger-emphasis text-white p-2">
              <i class="bi bi-cart3"></i></span>
            <img src="asset.img/profile.jpg" alt="Foto profil" width="34" height="34" class="rounded-circle border border-2 border-secondary object-fit-cover">
            <span class="d-none d-sm-inline text-decoration-underline">Hallo Yoseph!</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end mt-4 shadow-sm rounded-4 border border-2 p-3 font-monospace" aria-labelledby="profileDropdown">
            <li class="d-flex align-items-center gap-3 pb-2">
              <img src="asset.img/profile.jpg" alt="SETAN IRENG" width="54" height="54" class="rounded-circle border border-2 border-secondary object-fit-cover">
              <div class="lh-sm"><div class="fw-bold text-nowrap">SETAN IRENG</div><small class="text-secondary">@setan_ireng</small></div>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item d-flex align-items-center gap-3 rounded-3 py-2 small text-secondary" href="#"><i class="bi bi-person fs-5"></i> Pengaturan</a></li>
            <li><a class="dropdown-item d-flex align-items-center gap-3 rounded-3 py-2 small text-secondary" href="pesanan_saya.html"><i class="bi bi-box-seam fs-5"></i> Pesanan Saya</a></li>
            <li><a class="dropdown-item d-flex align-items-center gap-3 rounded-3 py-2 small text-secondary" href="keranjang.html"><i class="bi bi-cart-plus fs-5"></i> Keranjang</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item d-flex align-items-center gap-3 rounded-3 py-2 small fw-bold text-danger-emphasis" style="color:#790D16" href="#"><i class="bi bi-box-arrow-right fs-5"></i> Keluar</a></li>
          </ul>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Buka menu">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <!-- Tengah: menu utama -->
      <div class="col-12 col-lg-6 order-lg-2">
        <div class="collapse navbar-collapse justify-content-center" id="mainNav">
          <ul class="navbar-nav gap-lg-3 pt-2 pt-lg-0 fw-semibold">
            <li class="nav-item"><a class="nav-link active text-danger-emphasis text-decoration-underline link-offset-3" style="color:#790D16" aria-current="page" href="dropdown.html">Beranda</a></li>
            <li class="nav-item"><a class="nav-link text-dark" href="#">Tentang</a></li>
            <li class="nav-item"><a class="nav-link text-dark" href="#">Produk</a></li>
            <li class="nav-item"><a class="nav-link text-dark" href="#">Kontak</a></li>
          </ul>
        </div>
      </div>

    </div>
  </div>
</nav>

<!-- Halaman kosong: menu profil tampil terbuka (sesuai wireframe). Klik "Hallo Yoseph!" untuk menutup/membukanya. -->
<main class="container py-5 min-vh-100"></main>

<!-- JS bawaan Bootstrap: dibutuhkan oleh data-bs-toggle (dropdown, navbar, tab) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
